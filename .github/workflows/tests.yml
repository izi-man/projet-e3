name: Tests QCM AI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: |
          python -m pytest

      - name: Construire l'image Docker
        run: |
          docker build -t qcm-ai-api:ci .

      - name: Démarrer le conteneur Docker
        run: |
          docker run -d \
            --name qcm-ai-api-test \
            -p 8000:8000 \
            qcm-ai-api:ci

      - name: Vérifier que l'API fonctionne
        run: |
          for i in {1..20}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs qcm-ai-api-test
          exit 1

      - name: Nettoyer le conteneur
        if: always()
        run: |
          docker rm -f qcm-ai-api-test